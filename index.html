<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPBL 賽前先發公布 - 教練專屬管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .bg-grid { background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
    </style>
</head>
<body class="bg-grid min-h-screen pb-20">

    <!-- 登入遮罩 Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="w-14 h-14 bg-yellow-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-yellow-500 text-2xl border border-yellow-500/20">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-black text-white mb-1">教練專屬後台登入</h2>
            <p class="text-xs text-gray-400 mb-6">請輸入教練安全密碼 (預設: 0000)</p>
            
            <input type="password" id="passInput" placeholder="請輸入密碼" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-center text-white tracking-widest text-lg mb-4 focus:outline-none focus:border-yellow-500">
            <button onclick="checkPassword()" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-gray-950 font-black py-3 rounded-xl shadow-lg hover:opacity-95 transition">
                進入教練後台
            </button>
            <p id="errorMsg" class="text-xs text-red-400 mt-3 hidden">密碼錯誤，請重新輸入 (預設 0000)</p>
            <div class="mt-6 pt-4 border-t border-gray-800">
                <a href="fan_app.html" class="text-xs text-gray-400 hover:text-white transition">← 返回球迷觀看端</a>
            </div>
        </div>
    </div>

    <!-- 頂部導覽 -->
    <header class="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-40 backdrop-blur">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-clipboard-user text-yellow-500 text-xl"></i>
                <span class="font-black text-lg tracking-wider text-white">教練先發名單編輯區</span>
            </div>
            <div class="flex items-center space-x-3">
                <a href="fan_app.html" target="_blank" class="text-xs bg-gray-800 hover:bg-gray-700 text-yellow-400 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                    <i class="fa-solid fa-eye mr-1"></i> 預覽球迷端
                </a>
                <button onclick="publishLineup()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-1.5 rounded-lg text-xs shadow-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 立即發布至雲端
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">
        <!-- 賽事與隊伍設定 -->
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h3 class="font-black text-base text-yellow-400 flex items-center gap-2 border-b border-gray-800 pb-2">
                <i class="fa-solid fa-gear"></i> 比賽基本資訊與密碼設定
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-bold">主隊名稱</label>
                    <input type="text" id="homeTeam" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-bold">客隊名稱</label>
                    <input type="text" id="awayTeam" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-bold">比賽日期與場地</label>
                    <input type="text" id="gameDate" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
            </div>
            <div class="pt-2 flex items-center gap-3">
                <span class="text-xs text-gray-400">修改教練後台密碼：</span>
                <input type="text" id="newPassword" placeholder="輸入新密碼" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1 text-xs text-white w-36">
                <button onclick="updatePassword()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 px-3 py-1 rounded-lg text-xs">更新密碼</button>
            </div>
        </div>

        <!-- 投手設定 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 客隊先發投手編輯 -->
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 space-y-3">
                <h4 class="font-black text-sm text-orange-400">客隊先發投手</h4>
                <input type="text" id="awayPitcherName" placeholder="投手姓名" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="awayPitcherEra" placeholder="防禦率 (例:1.82)" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                    <input type="text" id="awayPitcherRecord" placeholder="戰績 (例:5勝1敗)" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                    <input type="text" id="awayPitcherSo" placeholder="三振 (例:68)" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                </div>
            </div>

            <!-- 主隊先發投手編輯 -->
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 space-y-3">
                <h4 class="font-black text-sm text-yellow-400">主隊先發投手</h4>
                <input type="text" id="homePitcherName" placeholder="投手姓名" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="homePitcherEra" placeholder="防禦率 (例:2.15)" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                    <input type="text" id="homePitcherRecord" placeholder="戰績 (例:7勝2敗)" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                    <input type="text" id="homePitcherSo" placeholder="三振 (例:75)" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
                </div>
            </div>
        </div>

        <!-- 打線編輯區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 客隊打線編輯 -->
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 shadow-xl">
                <h4 class="font-black text-sm text-orange-400 mb-3">客隊 9 人先發打線</h4>
                <div id="awayLineupEditor" class="space-y-2"></div>
            </div>

            <!-- 主隊打線編輯 -->
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 shadow-xl">
                <h4 class="font-black text-sm text-yellow-400 mb-3">主隊 9 人先發打線</h4>
                <div id="homeLineupEditor" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- 腳本邏輯 -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://cpbl-lineup-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let coachPassword = localStorage.getItem('cpblCoachPwd') || '0000';

        function checkPassword() {
            const input = document.getElementById('passInput').value;
            if (input === coachPassword) {
                document.getElementById('loginModal').style.display = 'none';
                loadDataToEditor();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function updatePassword() {
            const newPwd = document.getElementById('newPassword').value;
            if (!newPwd) return alert('請輸入新密碼！');
            coachPassword = newPwd;
            localStorage.setItem('cpblCoachPwd', newPwd);
            alert('教練後台密碼更新成功！');
            document.getElementById('newPassword').value = '';
        }

        function buildEditor(containerId, lineupData) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            lineupData.forEach((p, i) => {
                const row = document.createElement('div');
                row.className = "grid grid-cols-12 gap-1 bg-gray-800/60 p-2 rounded-lg border border-gray-700/50 items-center text-xs";
                row.innerHTML = `
                    <span class="col-span-1 text-center font-bold text-yellow-400">${i+1}</span>
                    <input type="text" value="${p.name}" class="col-span-4 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-white name-input">
                    <input type="text" value="${p.pos}" class="col-span-3 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-white pos-input" placeholder="守位">
                    <input type="text" value="${p.num}" class="col-span-2 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-white num-input" placeholder="背號">
                    <input type="text" value="${p.avg}" class="col-span-2 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-white avg-input" placeholder="打擊率">
                `;
                container.appendChild(row);
            });
        }

        function loadDataToEditor() {
            db.ref('currentMatch').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                document.getElementById('homeTeam').value = data.homeTeam || '';
                document.getElementById('awayTeam').value = data.awayTeam || '';
                document.getElementById('gameDate').value = data.gameDate || '';

                if (data.awayPitcher) {
                    document.getElementById('awayPitcherName').value = data.awayPitcher.name || '';
                    document.getElementById('awayPitcherEra').value = data.awayPitcher.era || '';
                    document.getElementById('awayPitcherRecord').value = data.awayPitcher.record || '';
                    document.getElementById('awayPitcherSo').value = data.awayPitcher.so || '';
                }
                if (data.homePitcher) {
                    document.getElementById('homePitcherName').value = data.homePitcher.name || '';
                    document.getElementById('homePitcherEra').value = data.homePitcher.era || '';
                    document.getElementById('homePitcherRecord').value = data.homePitcher.record || '';
                    document.getElementById('homePitcherSo').value = data.homePitcher.so || '';
                }

                if (data.awayLineup) buildEditor('awayLineupEditor', data.awayLineup);
                if (data.homeLineup) buildEditor('homeLineupEditor', data.homeLineup);
            });
        }

        function extractLineup(containerId) {
            const container = document.getElementById(containerId);
            const rows = container.children;
            const result = [];
            for (let row of rows) {
                result.push({
                    name: row.querySelector('.name-input').value,
                    pos: row.querySelector('.pos-input').value,
                    num: row.querySelector('.num-input').value,
                    avg: row.querySelector('.avg-input').value
                });
            }
            return result;
        }

        function publishLineup() {
            const updatedData = {
                homeTeam: document.getElementById('homeTeam').value,
                awayTeam: document.getElementById('awayTeam').value,
                gameDate: document.getElementById('gameDate').value,
                awayPitcher: {
                    name: document.getElementById('awayPitcherName').value,
                    era: document.getElementById('awayPitcherEra').value,
                    record: document.getElementById('awayPitcherRecord').value,
                    so: document.getElementById('awayPitcherSo').value
                },
                homePitcher: {
                    name: document.getElementById('homePitcherName').value,
                    era: document.getElementById('homePitcherEra').value,
                    record: document.getElementById('homePitcherRecord').value,
                    so: document.getElementById('homePitcherSo').value
                },
                awayLineup: extractLineup('awayLineupEditor'),
                homeLineup: extractLineup('homeLineupEditor')
            };

            db.ref('currentMatch').set(updatedData).then(() => {
                alert('✨ 先發名單已成功發布至雲端！球迷端將同步更新。');
            }).catch((error) => {
                alert('發布失敗: ' + error.message);
            });
        }
    </script>
</body>
</html>
